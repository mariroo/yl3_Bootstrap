     TELLIMUSE ANDMED
     ===================================== -->
        <div class="col-lg-6">
          <!--Tee ise (yl3.4): korrasta (lisa) ostukorvi vormi nii, et sellel oleks väljad kasutaja andmete jaoks, makse ja tarneviisi valik ning ostukorv oleks kujundatud järgides kasutajaliidese disaini põhimõtteid.-->

          <div class="card">
            <div class="card-body">
              <h4 class="card-title mb-4">Tellimuse andmed:</h4>

              <form>
                <!-- KASUTAJA ANDMED -->
                <h5 class="mb-3">Kontaktandmed</h5>

                <div class="row g-2">
                  <!-- Eesnimi -->
                  <div class="col-md-6">
                    <label for="eesnimi" class="form-label">Eesnimi</label>
                    <input type="text" class="form-control" id="eesnimi" required>
                  </div>

                  <!-- Perekonnanimi -->
                  <div class="col-md-6">
                    <label for="perenimi" class="form-label">Perekonnanimi</label>
                    <input type="text" class="form-control" id="perenimi" required>
                  </div>

                  <!-- E-post -->
                  <div class="col-md-6">
                    <label for="email" class="form-label">E-post</label>
                    <input type="email" class="form-control" id="email" placeholder="email@email.com" required>
                  </div>

                  <!-- Telefon -->
                  <div class="col-md-6">
                    <label for="telefon" class="form-label">Telefon</label>
                    <input type="tel" class="form-control" id="telefon" placeholder="+372 5555 555" required>
                  </div>

                </div>

                <!-- TARNEVIIS -->
                <h5 class="mt-4 mb-3">Tarneviis</h5>

                <div class="form-check mb-2">
                  <input class="form-check-input" type="radio" name="tarne" id="pakiautomaat" checked>

                  <label class="form-check-label" for="pakiautomaat">
                    Pakiautomaat
                  </label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="radio" name="tarne" id="kuller">

                  <label class="form-check-label" for="kuller">
                    Kuller
                  </label>
                </div>


                <!-- MAKSEVIIS -->
                <h5 class="mt-4 mb-3">Makseviis</h5>

                <div class="form-check mb-2">
                  <input class="form-check-input" type="radio" name="makse" id="pangalink" checked>

                  <label class="form-check-label" for="pangalink">
                    Pangalingiga
                  </label>
                </div>

                <div class="form-check mb-4">
                  <input class="form-check-input" type="radio" name="makse" id="arve">

                  <label class="form-check-label" for="kaart">
                    Arvega
                  </label>
                </div>

                <!-- 'Vormista tellimus' button -->
                <button type="submit" class="btn btn-primary btn-lg w-100">
                  Vormista tellimus
                </button>

              </form>
